# Acoperiș PRO — configurație Worker (deploy: npx wrangler deploy)
name = "online-store"
main = "worker.js"
compatibility_date = "2024-11-01"

# Site static din public/ (servit prin binding-ul ASSETS din worker.js)
[assets]
directory = "./public"
binding = "ASSETS"

# Bază de date D1
[[d1_databases]]
binding = "DB"
database_name = "acoperispro-db"
database_id = "0cee0dde-6289-4c35-b7da-cb7c147c917c"
